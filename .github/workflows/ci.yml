# Continuous integration (issue #83): tests without a database, lint, the eval set's deterministic
# checks with the red-team regressions, and a secret scan. No job calls a language model, connects to
# a database or deploys anything, and no job uses a repository secret.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install dependencies
        run: pip install -r core/requirements.txt
      - name: pytest (database-backed tests skip without DATABASE_URL)
        # The eval set and the red-team regressions run in their own job below.
        run: pytest core -q --ignore=core/eval -k "not redteam"

  eval:
    name: Eval set and red-team regressions (no model, no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install dependencies
        run: pip install -r core/requirements.txt
      - name: Eval set checks (core/eval)
        shell: bash
        run: |
          if [ -d core/eval ]; then
            pytest core/eval -q
          else
            echo "::notice title=Eval set skipped::core/eval is not on this branch yet; its checks run as soon as it lands."
          fi
      - name: Red-team regressions (scripted and rule models)
        shell: bash
        run: |
          rc=0
          pytest core -q --ignore=core/eval -k redteam || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice title=No red-team tests yet::no test named *redteam* on this branch."
            exit 0
          fi
          exit "$rc"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .

  secrets:
    name: Secret scan (gitleaks, full history of every branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every branch and tag with its whole history
          persist-credentials: false
      - name: Install gitleaks (release archive, checksum pinned)
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the whole history (findings are redacted)
        run: >
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--all"
          --redact --no-banner --verbose --exit-code 1 .
