# Eval set for the money coach (issue #40). Run: python core/eval/run.py --source reference
#
# Every case: id, persona (core/config/personas.yaml), question (en, and fi for some), intent, expect,
# expected tools (agent-core.md section 6.5), tags, and the items the answer is checked against:
#   numbers  every one must be in the answer's Number objects and in its text, within tolerance;
#            one with `required: false` may be stated but need not be (it is still checked)
#   dates    every one must be among the dates the answer returns (bills, payday)
#   labels   every key must be among the keys the answer reports (profile, what-if status)
#   forbid   none may appear in the answer (a value a confused coach would give)
# expect: answered | no_data (answered, but no number: the period has no data) | refused (a refusal
# template of one of refusal_kinds, and no data tool call).
# Each item's `source` is the metric file and output column, or the plain spending query, that
# produced `value` (core/eval/expected.py); `multiply` scales it and `plus` adds other sources to it (a sum
# a confused coach would give, for `forbid`). Values are for as_of. Do not edit values by hand:
# python core/eval/expected.py --write regenerates them, and --check proves they are current.
# Period presets, resolved for as_of 2026-09-30: last month = 2026-08; this month = 2026-09-01 to
# today; last 3 months = the last 3 complete calendar months, 2026-07 to 2026-09 (as last_6_months in
# agent-core.md); last 6 months = the metrics window 2026-04 to 2026-09.
# "Dining out" is the category Restaurants; the MCC group restaurants is card payments only.

as_of: '2026-09-30'
