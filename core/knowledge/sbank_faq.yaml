  - id: instant_payment
    topic: accounts
    questions_en: ["What is an instant payment?", "How is an instant transfer different from a normal transfer?"]
    questions_fi: ["Mikä on pikasiirto?", "Miten pikasiirto eroaa tilisiirrosta?"]
    answer_en: "S-Bank's help pages say an instant payment reaches the recipient right away, at any time of day, and can be chosen in S-mobiili or the online bank when making a new payment. A normal transfer suits bills with a later due date and repeating payments, and it moves on working days."
    answer_fi: "S-Pankin ohjeiden mukaan pikasiirto menee saajalle heti mihin vuorokaudenaikaan tahansa, ja sen voi valita S-mobiilissa tai verkkopankissa uutta maksua tehdessä. Tavallinen tilisiirto sopii laskuihin, joiden eräpäivä on myöhemmin, ja toistuviin maksuihin, ja se välitetään arkipäivisin."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/tilit/mika-on-pikasiirto-ja-miten-se-eroaa-tavallisesta-tilisiirrosta/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["instant payment", "instant transfer"]
      fi: ["pikasiir"]

  - id: payee_check
    topic: accounts
    questions_en: ["What is the payee check?", "What does verification of payee mean?"]
    questions_fi: ["Mikä on maksunsaajan tarkistus?", "Mitä maksunsaajan tarkistus tarkoittaa?"]
    answer_en: "S-Bank's help pages say that when you make a transfer or an instant payment, the system tells you whether the recipient's name and account number match. The check lowers the risk of a payment going to the wrong person because of a typing mistake or a scam; if they do not match, the payment still goes by the account number you typed."
    answer_fi: "S-Pankin ohjeiden mukaan tilisiirtoa tai pikasiirtoa tehdessä järjestelmä kertoo, vastaavatko saajan nimi ja tilinumero toisiaan. Tarkistus pienentää riskiä, että maksu menee väärälle saajalle näppäilyvirheen tai huijauksen takia; jos ne eivät vastaa toisiaan, maksu välitetään silti kirjoitetun tilinumeron perusteella."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/tilit/mika-on--mita-tarkoittaa-maksunsaajan-tarkistus/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["payee check", "verification of payee", "payee verification", "payee name check", "name check"]
      fi: ["maksunsaajan tarkistu", "saajan tarkistu"]

  - id: deposit_protection
    topic: accounts
    questions_en: ["Is my money safe in S-Bank?", "How are deposits protected at S-Bank?"]
    questions_fi: ["Ovatko rahani turvassa S-Pankissa?", "Miten talletukset on turvattu?"]
    answer_en: "S-Bank's help pages say the Finnish Financial Supervisory Authority supervises banks and their capital. Deposits are also covered by the deposit guarantee fund, which pays depositors up to a legal limit if a bank cannot."
    answer_fi: "S-Pankin ohjeiden mukaan Finanssivalvonta valvoo pankkeja ja niiden vakavaraisuutta. Talletuksia turvaa lisäksi talletussuojarahasto, joka korvaa tallettajien saatavat lain mukaiseen rajaan asti, jos pankki ei itse pysty maksamaan."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/tilit/miten-s-pankin-tileilla-olevat-varat-on-turvattu-ovatko-rahani-turvassa-s-pankissa/"
