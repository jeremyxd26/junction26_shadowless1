  - id: card_limits
    topic: cards
    questions_en: ["How do I change my card's security limits?", "Where can I change the purchase limit of my card?"]
    questions_fi: ["Miten muutan kortin turvarajoja?", "Missä voin muuttaa kortin ostorajaa?"]
    answer_en: "S-Bank's help pages say a card's security limits can be changed in the online bank under Cards, in S-mobiili's Bank section under Cards, Details and settings, at a customer service point, or by phone. The card limits do not change the account's own daily payment limit."
    answer_fi: "S-Pankin ohjeiden mukaan kortin turvarajoja voi muuttaa verkkopankissa kohdassa Kortit, S-mobiilin Pankki-osiossa kohdassa Kortit, Tiedot ja asetukset, asiakaspalvelupisteessä tai puhelimessa. Kortin turvarajat eivät muuta tilin omaa vuorokausikohtaista maksurajaa."
