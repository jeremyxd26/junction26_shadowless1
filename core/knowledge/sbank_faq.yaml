    answer_fi: "S-Pankin ohjeiden mukaan saapuneesta e-laskusta voi tilata ilmoituksen sähköpostiin. S-mobiilissa se löytyy kohdasta Pankki, E-laskut, E-laskupalvelusopimus, Saapumisilmoitus ja verkkopankissa kohdasta Maksut, E-laskupalvelusopimus."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/miten-saan-ilmoituksen-saapuneesta-e-laskusta/"
