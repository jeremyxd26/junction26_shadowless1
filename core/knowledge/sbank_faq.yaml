# S-Bank knowledge base (#791): short answers about S-Bank and S-mobiili, written in our own words from
# S-Bank's public customer help pages (s-pankki.fi). Each answer says what the help page says, never as
# the bank. No prices, rates or other numbers, and no advice. The raw pages are not in the repository.
#
# Fields: id, topic, questions_en / questions_fi (question variants), answer_en / answer_fi, source_url,
# retrieved_at (ISO date), and keywords (en / fi phrases the keyword matcher looks for, optional).
# core/agent/sbank_kb.py reads this file; find_bank_entry() is the one lookup.

entries:
  - id: e_invoice
    topic: payments
    questions_en: ["How do e-invoices work at S-Bank?", "How do I start getting e-invoices in S-mobiili?"]
    questions_fi: ["Miten e-lasku toimii S-Pankissa?", "Miten tilaan e-laskun S-mobiiliin?"]
    answer_en: "An e-invoice is an electronic bill that arrives in the S-Bank online bank or in S-mobiili with the payment details already filled in, so it only needs checking and approving. S-Bank's help pages say e-invoices can be ordered from billers that send them, in the online bank or in S-mobiili after paying one of their bills."
    answer_fi: "E-lasku on sähköinen lasku, joka tulee S-Pankin verkkopankkiin tai S-mobiiliin maksutiedot valmiiksi täytettyinä, joten se vain tarkistetaan ja hyväksytään. S-Pankin ohjeiden mukaan e-laskun voi tilata sitä tarjoavalta laskuttajalta verkkopankissa tai S-mobiilissa laskun maksamisen jälkeen."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mika-on-e-lasku/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["e-invoice", "einvoice", "e invoice", "electronic invoice", "electronic bill"]
      fi: ["e-lask", "verkkolask"]

  - id: direct_debit
    topic: payments
    questions_en: ["How does direct debit work at S-Bank?", "How do I set up a direct debit?"]
    questions_fi: ["Miten suoramaksu toimii?", "Miten otan suoramaksun käyttöön?"]
    answer_en: "With a direct debit, the biller sends the bill details to the bank, and the bank takes the amount from the account automatically on the due date; the biller also sends a bill that mentions this. S-Bank's help pages say direct debit is for customers without S-Bank online banking codes, and it is set up at an S-Bank customer service point."
    answer_fi: "Suoramaksussa laskuttaja lähettää laskun tiedot pankille, ja pankki veloittaa summan tililtä automaattisesti eräpäivänä; laskuttaja lähettää myös laskun, jossa tästä kerrotaan. S-Pankin ohjeiden mukaan suoramaksu on tarkoitettu asiakkaille, joilla ei ole S-Pankin verkkopankkitunnuksia, ja se otetaan käyttöön S-Pankin asiakaspalvelupisteessä."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mika-on-suoramaksu/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["direct debit", "direct payment"]
      fi: ["suoramaks"]

  - id: iban
    topic: payments
    questions_en: ["What is an IBAN?", "Where do I find my IBAN account number?"]
    questions_fi: ["Mikä on IBAN?", "Mistä löydän IBAN-tilinumeroni?"]
    answer_en: "An IBAN is the international form of a bank account number, and it starts with a letter code for the country; in Finland that code is FI. S-Bank's help pages say your own IBAN is shown in the online bank on the Accounts tab and on your account statement."
    answer_fi: "IBAN on pankkitilinumeron kansainvälinen muoto, ja sen alussa on maan kirjaintunnus; Suomessa tunnus on FI. S-Pankin ohjeiden mukaan oman IBAN-tilinumeron näkee verkkopankin Tilit-välilehdeltä ja tiliotteelta."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mika-on-iban-tilinumero-ja-mista-sen-loytaa/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["iban", "account number"]
      fi: ["iban", "tilinumeroni", "tilinumeron"]

  - id: bic
    topic: payments
    questions_en: ["What is S-Bank's BIC code?", "What is a SWIFT code?"]
    questions_fi: ["Mikä on S-Pankin BIC-tunnus?", "Mikä on SWIFT-tunnus?"]
    answer_en: "A BIC, also called a SWIFT code, tells a payment which bank an account number belongs to. S-Bank's help pages give its BIC as SBANFIHH, and it is also shown in the online bank."
    answer_fi: "BIC-tunnus, jota kutsutaan myös SWIFT-tunnukseksi, kertoo maksussa, mille pankille tilinumero kuuluu. S-Pankin ohjeiden mukaan sen BIC-tunnus on SBANFIHH, ja tunnus näkyy myös verkkopankissa."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mika-on-bic-tunnus-ja-mista-sen-loytaa/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["bic", "swift"]
      fi: ["bic", "swift"]

  - id: sepa
    topic: payments
    questions_en: ["What does SEPA mean?", "What is the SEPA area?"]
    questions_fi: ["Mitä SEPA tarkoittaa?", "Mikä on SEPA-alue?"]
    answer_en: "SEPA stands for the Single Euro Payments Area, where a transfer is paid the same way at home and to another country. S-Bank's help pages say every account in the area has an IBAN and the bank has its own BIC, and the area covers the European Union and some nearby countries."
    answer_fi: "SEPA tarkoittaa yhtenäistä euromaksualuetta, jolla tilisiirto maksetaan samalla tavalla kotimaahan ja ulkomaille. S-Pankin ohjeiden mukaan alueen kaikilla tileillä on IBAN-tilinumero ja pankilla oma BIC-tunnus, ja alueeseen kuuluvat Euroopan unionin maat ja muutama lähimaa."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mita-lyhenne-sepa-tarkoittaa/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["sepa"]
      fi: ["sepa"]

  - id: e_invoice_edit
    topic: payments
    questions_en: ["How do I edit or delete an e-invoice?", "How can I cancel an e-invoice in S-mobiili?"]
    questions_fi: ["Miten muokkaan tai poistan e-laskun?", "Miten poistan e-laskutilauksen S-mobiilissa?"]
    answer_en: "S-Bank's help pages say e-invoices can be edited or deleted in S-mobiili under Bank, E-invoices, or in the online bank under Payments, E-invoice orders. To change an e-invoice, the pages suggest deleting the order and ordering it again on a later day, so the biller gets the change."
    answer_fi: "S-Pankin ohjeiden mukaan e-laskuja voi muokata tai poistaa S-mobiilissa kohdassa Pankki, E-laskut tai verkkopankissa kohdassa Maksut, E-laskutilaukset. Muutosta varten ohjeet neuvovat poistamaan tilauksen ja tilaamaan sen uudelleen myöhempänä päivänä, jotta muutos menee laskuttajalle."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/miten-muokkaan-tai-poistan-e-laskun/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["edit an e-invoice", "edit e-invoice", "edit my e-invoice", "delete an e-invoice", "delete e-invoice", "delete my e-invoice", "cancel an e-invoice", "cancel e-invoice", "cancel my e-invoice", "change an e-invoice", "change my e-invoice", "remove an e-invoice", "remove e-invoice"]
      fi: ["muokkaan e-lask", "muokata e-lask", "muokkaa e-lask", "poistan e-lask", "poistaa e-lask", "poista e-lask", "e-laskun muokkau", "e-laskun poisto", "e-laskutilauksen poist", "poistan e-laskutilauksen"]

  - id: e_invoice_notice
    topic: payments
    questions_en: ["How do I get a notice when an e-invoice arrives?", "Can I get an email about a new e-invoice?"]
