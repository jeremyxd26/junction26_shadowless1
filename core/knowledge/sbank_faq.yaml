  - id: debit
    topic: cards
    questions_en: ["What does debit mean on my card?", "What is a debit card?"]
    questions_fi: ["Mitä debit tarkoittaa?", "Mikä on debit-kortti?"]
    answer_en: "Debit means a card linked to a bank account: it is used within the account's balance and the card's limits. S-Bank's help pages say a debit card works for purchases, also online, and for cash withdrawals around the world, and purchases are charged to the account a few days later."
    answer_fi: "Debit tarkoittaa pankkitiliin liitettyä korttia, jota käytetään tilin saldon ja kortin käyttörajojen puitteissa. S-Pankin ohjeiden mukaan debit-kortilla voi maksaa ostoksia myös verkossa ja nostaa käteistä ympäri maailman, ja ostot veloitetaan tililtä muutaman päivän kuluttua."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/kortit/mita-tarkoittaa-debit/"
