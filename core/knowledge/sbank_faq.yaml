      fi: ["saapumisilmoitu", "saapuneesta e-lask", "ilmoitus e-lask", "ilmoituksen e-lask", "ilmoitus uudesta e-lask"]

  - id: e_invoice_move
    topic: payments
    questions_en: ["How do I move my e-invoices to S-Bank?", "Can I transfer my e-invoices from another bank?"]
    questions_fi: ["Miten siirrän e-laskuni S-Pankkiin?", "Voinko siirtää e-laskut toisesta pankista?"]
    answer_en: "S-Bank's help pages say to end the e-invoice orders in the other bank's online bank first, and then order them again in S-mobiili or the S-Bank online bank. In S-mobiili new e-invoices are ordered under Bank, Payments and e-invoices, Order e-invoices, by finding the biller in the list."
    answer_fi: "S-Pankin ohjeiden mukaan e-laskutilaukset lopetetaan ensin toisen pankin verkkopankissa, ja sen jälkeen ne tilataan uudelleen S-mobiiliin tai S-Pankin verkkopankkiin. S-mobiilissa uudet e-laskut tilataan kohdassa Pankki, Maksut ja e-laskut, Tilaa e-laskuja etsimällä laskuttaja listalta."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/kuinka-voin-siirtaa-e-laskutilaukset-ja-toistuvat-maksut-s-pankkiin/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["move my e-invoices", "move e-invoices", "transfer my e-invoices", "transfer e-invoices", "switch my e-invoices", "e-invoices from another bank", "e-invoices to s-bank"]
      fi: ["siirran e-lask", "siirtaa e-lask", "siirra e-lask", "e-laskujen siirto", "e-laskut toisesta pankista", "e-laskut s-pankkiin", "e-laskuni s-pankkiin"]

  - id: e_invoice_not_working
    topic: payments
    questions_en: ["My e-invoice is not working, what do I do?", "Why doesn't my e-invoice work?"]
    questions_fi: ["Mitä teen, jos e-laskuni ei toimi?", "Miksi e-lasku ei toimi?"]
    answer_en: "S-Bank's help pages say to check the bill's payment details in S-mobiili under Bank, Payments and e-invoices, or in the online bank under Payments, E-invoice orders. If something is wrong, the pages suggest deleting the order and making a new one on the next working day; starting e-invoicing can take several weeks, depending on the biller."
    answer_fi: "S-Pankin ohjeiden mukaan laskun maksutiedot tarkistetaan S-mobiilissa kohdassa Pankki, Maksut ja e-laskut tai verkkopankissa kohdassa Maksut, E-laskutilaukset. Jos tiedoissa on virhe, ohjeet neuvovat poistamaan tilauksen ja tekemään uuden seuraavana arkipäivänä; e-laskun voimaantulo voi laskuttajasta riippuen kestää useita viikkoja."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/maksaminen/mita-teen-jos-e-laskuni-ei-toimi/"
    retrieved_at: "2026-11-15"
    keywords:
      en: ["e-invoice is not working", "e-invoice not working", "e-invoice doesn't work", "e-invoice does not work", "e-invoice isn't working", "problem with my e-invoice", "e-invoice problem"]
      fi: ["e-lasku ei toimi", "e-laskuni ei toimi", "e-lasku ei tule", "e-laskuni ei tule", "ongelma e-lasku"]

  - id: open_account
    topic: accounts
    questions_en: ["How do I open an account at S-Bank?", "How do I become an S-Bank customer?"]
    questions_fi: ["Miten avaan tilin S-Pankkiin?", "Miten minusta tulee S-Pankin asiakas?"]
    answer_en: "S-Bank's help pages say a new customer can open S-Bank services online or at an S-Bank customer service point, which also helps with switching banks. A customer who already has S-Bank online banking codes can open a new account in S-mobiili under Bank, Accounts, Open account, or in the online bank under Accounts."
    answer_fi: "S-Pankin ohjeiden mukaan uusi asiakas voi avata S-Pankin palvelut verkossa tai S-Pankin asiakaspalvelupisteessä, jossa autetaan myös pankin vaihdossa. Asiakas, jolla on jo S-Pankin verkkopankkitunnukset, voi avata uuden tilin S-mobiilissa kohdassa Pankki, Tilit, Avaa tili tai verkkopankissa kohdassa Tilit."
    source_url: "https://www.s-pankki.fi/fi/asiakaspalvelu/ukk/kysymykset/tilit/miten-saan-avattua-tilin-s-pankkiin/"
    retrieved_at: "2026-11-15"
