# Lint configuration for CI (issue #83). Deliberately minimal: syntax errors, undefined names,
# unused imports and variables, and similar bugs. No formatting and no style rules, so the
# existing code passes without a rewrite. Widen it in its own PR, never together with a feature.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # ambiguous variable name such as `l`: style only
    "F541",  # f-string without placeholders: harmless
]
